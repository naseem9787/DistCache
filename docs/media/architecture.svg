<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" role="img" aria-label="DistCache architecture: clients, the router with ring and failover coordinator, shards with a primary and two replicas">
<title>DistCache architecture</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="1000" height="660" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="330" y="18" width="340" height="46" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="500" y="38" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle" >Clients</text>
<text x="500" y="55" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle" >redis-cli  ·  any RESP client  ·  smart client (same ring)</text>
<line x1="500" y1="64" x2="500" y2="104" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="560" y="88" font-size="11" font-weight="400" fill="#57606a" text-anchor="middle" >RESP over TCP</text>
<rect x="40" y="104" width="920" height="156" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
<text x="60" y="128" font-size="15" font-weight="700" fill="#0969da" text-anchor="start" >distcache_router</text>
<text x="940" y="128" font-size="11.5" font-weight="400" fill="#0969da" text-anchor="end" >one process; one coordinator thread per replicated shard</text>
<rect x="60" y="142" width="270" height="100" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="75" y="162" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Consistent-hash ring</text>
<text x="75" y="180" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >key (hash tags) → shard NAME</text>
<text x="75" y="197" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >160 virtual nodes per node</text>
<text x="75" y="214" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >live add / remove with MIGRATE</text>
<text x="75" y="231" font-size="12" font-weight="400" fill="#57606a" text-anchor="start" >(resumable if a step fails)</text>
<rect x="350" y="142" width="270" height="100" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="365" y="162" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Route + availability</text>
<text x="365" y="180" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >shard → current primary address</text>
<text x="365" y="197" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >a shard that is ambiguous or</text>
<text x="365" y="214" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >has no safe primary is marked</text>
<text x="365" y="231" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >unavailable: reads AND writes refused</text>
<rect x="640" y="142" width="300" height="100" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="655" y="162" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Failover coordinator</text>
<text x="655" y="180" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >probe ROLE · renew write LEASE (2 s)</text>
<text x="655" y="197" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >detect failure · wait out the old lease</text>
<text x="655" y="214" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >PROMOTE best replica · bump epoch</text>
<text x="655" y="231" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >demote + resync a returning old primary</text>
<rect x="40" y="296" width="440" height="344" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="56" y="318" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Shard a</text>
<rect x="56" y="330" width="408" height="124" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
<text x="68" y="350" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="start" >PRIMARY  (epoch e, holds a lease)</text>
<text x="68" y="369" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >execute() → shard lock → engine (LRU, TTL, RL.* update)</text>
<text x="68" y="386" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >inside that same critical section, in order:</text>
<text x="80" y="402" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >1. WAL buffer (group commit, fsync policy)</text>
<text x="80" y="418" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >2. replication log, offset k (idempotent records)</text>
<text x="68" y="440" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="start" >reply held until: WAL durable ∧ N replicas ACKed k ∧ lease valid</text>
<rect x="56" y="500" width="200" height="120" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="68" y="520" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >REPLICA 1</text>
<text x="68" y="538" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >read-only (-READONLY on writes)</text>
<text x="68" y="555" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >applies  R offset record  in order</text>
<text x="68" y="572" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >duplicates skipped, gap → resync</text>
<text x="68" y="589" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >ACK offset  → primary</text>
<text x="68" y="608" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" >serves (possibly stale) reads</text>
<line x1="156" y1="454" x2="156" y2="500" stroke="#2da44e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="168" y="472" font-size="11" font-weight="400" fill="#2da44e" text-anchor="start" >stream</text>
<rect x="264" y="500" width="200" height="120" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="276" y="520" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >REPLICA 2</text>
<text x="276" y="538" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >read-only (-READONLY on writes)</text>
<text x="276" y="555" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >applies  R offset record  in order</text>
<text x="276" y="572" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >duplicates skipped, gap → resync</text>
<text x="276" y="589" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >ACK offset  → primary</text>
<text x="276" y="608" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" >serves (possibly stale) reads</text>
<line x1="364" y1="454" x2="364" y2="500" stroke="#2da44e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="260" y="490" font-size="10" font-weight="400" fill="#57606a" text-anchor="middle" >full resync = snapshot + replay</text>
<rect x="520" y="296" width="440" height="344" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="536" y="318" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Shard b</text>
<rect x="536" y="330" width="408" height="124" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
<text x="548" y="350" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="start" >PRIMARY  (epoch e, holds a lease)</text>
<text x="548" y="369" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >execute() → shard lock → engine (LRU, TTL, RL.* update)</text>
<text x="548" y="386" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" >inside that same critical section, in order:</text>
<text x="560" y="402" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >1. WAL buffer (group commit, fsync policy)</text>
<text x="560" y="418" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >2. replication log, offset k (idempotent records)</text>
<text x="548" y="440" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="start" >reply held until: WAL durable ∧ N replicas ACKed k ∧ lease valid</text>
<rect x="536" y="500" width="200" height="120" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="548" y="520" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >REPLICA 1</text>
<text x="548" y="538" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >read-only (-READONLY on writes)</text>
<text x="548" y="555" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >applies  R offset record  in order</text>
<text x="548" y="572" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >duplicates skipped, gap → resync</text>
<text x="548" y="589" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >ACK offset  → primary</text>
<text x="548" y="608" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" >serves (possibly stale) reads</text>
<line x1="636" y1="454" x2="636" y2="500" stroke="#2da44e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="648" y="472" font-size="11" font-weight="400" fill="#2da44e" text-anchor="start" >stream</text>
<rect x="744" y="500" width="200" height="120" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="756" y="520" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >REPLICA 2</text>
<text x="756" y="538" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >read-only (-READONLY on writes)</text>
<text x="756" y="555" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >applies  R offset record  in order</text>
<text x="756" y="572" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >duplicates skipped, gap → resync</text>
<text x="756" y="589" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >ACK offset  → primary</text>
<text x="756" y="608" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" >serves (possibly stale) reads</text>
<line x1="844" y1="454" x2="844" y2="500" stroke="#2da44e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="740" y="490" font-size="10" font-weight="400" fill="#57606a" text-anchor="middle" >full resync = snapshot + replay</text>
<line x1="180" y1="260" x2="180" y2="296" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="192" y="282" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" >forward by key</text>
<line x1="760" y1="260" x2="760" y2="296" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="772" y="282" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" >forward by key</text>
<path d="M660,242 L660,270 L420,270 L420,296" fill="none" stroke="#bf8700" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<path d="M900,242 L900,296" fill="none" stroke="#bf8700" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="540" y="288" font-size="10.5" font-weight="400" fill="#9a6700" text-anchor="middle" >LEASE · PROMOTE · REPLICAOF to each shard&#x27;s primary</text>
<text x="500" y="652" font-size="11" font-weight="400" fill="#57606a" text-anchor="middle" >Epochs fence stale primaries; with --repl-sync N and R replicas, promotion needs R-N+1 eligible replicas, so the promoted node holds every acknowledged write.</text>
</svg>
